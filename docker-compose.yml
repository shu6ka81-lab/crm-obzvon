services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Наружу порт не отдаём: база доступна только приложению
    expose:
      - '5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET в .env}
      NODE_ENV: production
      # Ключ голосового робота. Передаётся при запуске, а не при сборке:
      # иначе он окажется внутри образа и сменить его без пересборки нельзя.
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Записи разговоров — файлами на диске, не в базе: минута занимает
      # около мегабайта, и в Postgres это раздуло бы и её, и резервные копии.
      RECORDINGS_DIR: /app/data/recordings
    volumes:
      # Том, чтобы записи переживали пересборку образа
      - recordings:/app/data/recordings
    ports:
      # Только на localhost — наружу пускает обратный прокси с HTTPS
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
  recordings:
